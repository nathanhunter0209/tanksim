<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TankSim">
<meta name="theme-color" content="#05070a"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Tank Armor Lab</title>
<style>
:root{--cy:#5fe3ff;--cy2:#9feaff;--glass:rgba(14,20,28,.52);--bd:rgba(150,220,255,.16);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070a;font:13px/1.4 "Inter",system-ui,-apple-system,Segoe UI,Arial;color:#dfe9f1;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
#c{position:fixed;inset:0;touch-action:none;display:block}
#labels{position:fixed;inset:0;pointer-events:none}
.glass{position:fixed;background:linear-gradient(160deg,rgba(40,60,80,.32),rgba(8,12,18,.55));border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);touch-action:pan-y;overscroll-behavior:contain}
.hd{cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy2);font-weight:600}
.hd::after{content:'–';color:var(--cy)}.glass:not(.open) .hd::after{content:'+'}.glass:not(.open) .bd{display:none}
#card{top:calc(16px + var(--sat));left:calc(16px + var(--sal));width:min(380px,44vw);padding:16px 18px}
#kicker{font-size:10.5px;letter-spacing:.22em;color:#8fb3c6}
#title{font-size:30px;line-height:1.02;font-weight:900;letter-spacing:.01em;color:var(--cy);margin:4px 0 6px;text-shadow:0 0 24px rgba(95,227,255,.45)}
#sub{color:#c7d6e0;font-size:12.5px}#spec{color:#ffb070;font-size:11px;font-weight:600;margin-top:3px}
.pillx{display:inline-block;border:1px solid var(--cy);color:var(--cy);border-radius:20px;padding:0 8px;font-size:10.5px;font-weight:700;margin-right:4px}
#stats{display:flex;gap:8px;margin:10px 0 4px}#stats div{flex:1;background:rgba(95,227,255,.06);border:1px solid var(--bd);border-radius:10px;padding:5px 8px}
#stats b{display:block;font-size:17px;color:#fff}#stats i{font-style:normal;font-size:10px;color:#8fb3c6}
#zoneTag{color:#ffcf85;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#res{position:static;margin-top:10px;border-radius:12px;padding:8px 10px;background:rgba(0,0,0,.2)}
#res .bd{max-height:30vh;overflow:auto;margin-top:6px}
.out{font-size:18px;font-weight:800;margin:2px 0}.PEN{color:#ff5c5c}.NON{color:#5cf09a}.RIC,.FUZ{color:var(--cy)}.SPA{color:#ffab5c}
.meta{color:#9fb6c6;font-size:11.5px;margin:3px 0}.note{color:#ffc58a;font-size:11px;font-style:normal}
table{width:100%;border-collapse:collapse;font-size:11.5px}td,th{padding:3px 4px;border-bottom:1px solid rgba(150,220,255,.08);text-align:left}th{color:#8fb3c6;font-weight:500}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
#ctrl{top:calc(16px + var(--sat));right:calc(16px + var(--sar));width:300px;padding:12px 14px}
#ctrl .bd{margin-top:8px}
.row{margin:8px 0}.row>label{display:flex;justify-content:space-between;font-size:11px;color:#8fb3c6;margin-bottom:4px;letter-spacing:.05em}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{border:1px solid rgba(150,220,255,.25);background:rgba(255,255,255,.04);color:#cfe3ee;border-radius:999px;padding:4px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
.pill.on{background:linear-gradient(180deg,#5fe3ff,#2aa8cf);color:#03141c;border-color:transparent;font-weight:700;box-shadow:0 0 14px rgba(95,227,255,.45)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,#2aa8cf,#5fe3ff);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9feaff 40%,#2aa8cf);box-shadow:0 0 10px rgba(95,227,255,.7);border:none}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#9feaff;border:none}
#disc{font-size:10px;color:#7f97a6;margin-top:6px}
#exctl{display:none}#exctl.show{display:block}
#film{left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:min(980px,calc(100vw - 260px));padding:8px 12px 10px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}.strip::-webkit-scrollbar{display:none}
.slabel{font-size:9.5px;letter-spacing:.2em;color:#8fb3c6;margin:2px 2px 4px}
.card{flex:0 0 auto;width:122px;border:1px solid rgba(150,220,255,.18);border-radius:10px;background:rgba(0,0,0,.35);padding:0;overflow:hidden;cursor:pointer;color:#cfe3ee;font-family:inherit;transition:transform .15s,box-shadow .15s}
.card img{display:block;width:100%;height:68px;object-fit:cover;background:radial-gradient(ellipse at 50% 70%,#1b3444,#070b10)}
.card span{display:block;font-size:10.5px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 18px rgba(95,227,255,.4);transform:translateY(-2px)}
#shellStrip .card img{height:44px}
#knobs{position:fixed;left:calc(18px + var(--sal));bottom:calc(18px + var(--sab));display:flex;gap:10px;flex-direction:column}
.knob{width:52px;height:52px;border-radius:50%;border:1px solid rgba(150,220,255,.3);cursor:pointer;color:var(--cy2);font-size:18px;
 background:radial-gradient(circle at 50% 40%,rgba(60,90,110,.6),rgba(6,10,14,.85) 70%);box-shadow:0 0 0 4px rgba(255,255,255,.03),inset 0 0 0 6px rgba(95,227,255,.08),0 8px 20px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.knob.on{color:#03141c;background:radial-gradient(circle,#9feaff,#2aa8cf);box-shadow:0 0 18px rgba(95,227,255,.6)}
#xr{right:calc(16px + var(--sar));bottom:calc(14px + var(--sab));width:240px;padding:10px 12px}
#xc{width:100%;height:auto;display:block;margin-top:6px}
#tip{position:fixed;display:none;pointer-events:none;max-width:320px;padding:9px 11px;font-size:11.5px;z-index:5}
#tip b{color:var(--cy)}#tip i{color:#ffcf85;font-style:normal}#tip .tot td{color:#fff;font-weight:600}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + var(--sat));background:rgba(0,0,0,.4);border:1px solid var(--bd);padding:5px 14px;border-radius:20px;font-size:11.5px;color:#9fb6c6;pointer-events:none}
.callout{font-size:11px;color:#dff6ff;background:rgba(6,14,20,.66);border:1px solid rgba(95,227,255,.5);border-radius:8px;padding:4px 8px;white-space:nowrap;backdrop-filter:blur(6px);box-shadow:0 0 12px rgba(95,227,255,.15)}
.callout b{display:block;color:var(--cy);font-size:11.5px}.callout span{display:block;color:#a9c3d1}.callout .r{color:#ffcf85;font-weight:700}
.callout.hit{border-color:#ffb060}.callout.stop{border-color:#ff5c5c;box-shadow:0 0 16px rgba(255,92,92,.45)}.callout.stop .r{color:#ff7a7a}
#kCtl,#kXray{display:none}
@media (max-width:820px),(max-height:520px){
 #hint{display:none}
 #card{width:auto;right:calc(76px + var(--sar));left:calc(10px + var(--sal));top:calc(8px + var(--sat));padding:10px 12px}
 #title{font-size:21px;margin:2px 0}#stats{margin:6px 0 0}#stats b{font-size:14px}
 #res .bd{max-height:24vh}
 #ctrl{top:calc(8px + var(--sat));right:calc(10px + var(--sar));width:min(300px,calc(100vw - 20px));max-height:calc(100vh - 210px - var(--sat) - var(--sab));overflow:auto;z-index:4}
 #ctrl:not(.open){display:none}
 #kCtl,#kXray{display:block}
 #knobs{left:auto;right:calc(10px + var(--sar));top:calc(8px + var(--sat));bottom:auto;gap:8px}
 .knob{width:44px;height:44px;font-size:16px}
 #film{width:auto;left:0;right:0;transform:none;bottom:0;border-radius:16px 16px 0 0;padding:6px 10px calc(8px + var(--sab))}
 .card{width:92px}.card img{height:50px}#shellStrip .card img{height:34px}.card span{font-size:9.5px}
 #xr{left:calc(10px + var(--sal));right:calc(10px + var(--sar));width:auto;bottom:calc(168px + var(--sab));z-index:3}#xr:not(.open){display:none}
}
@media (max-height:520px) and (orientation:landscape){
 #card{width:min(330px,40vw);right:auto}#res .bd{max-height:28vh}
 #knobs{flex-direction:row}
 #film{left:auto;width:min(560px,58vw);right:calc(10px + var(--sar));border-radius:16px}#shellStrip .card img{height:28px}.card img{height:40px}
 #xr{left:auto;width:min(420px,50vw);bottom:auto;top:calc(60px + var(--sat))}
}
</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="hint">Click the tank to fire · drag to orbit · scroll to zoom · hover for armor zone</div>
<div id="card" class="glass open">
 <div id="kicker">ARMOR LAB</div><div id="title">—</div><div id="sub"></div><div id="spec">⚠ Unreleased vehicle — all data speculative</div>
 <div id="stats"></div>
 <div id="res" class="glass"><div class="hd"><span>Shot analysis · <span id="zoneTag">no shot yet</span></span></div><div class="bd" id="rinfo">Click / tap the tank to fire.</div></div>
</div>
<div id="ctrl" class="glass open"><div class="hd">Controls</div><div class="bd">
 <div class="row"><label><span>RANGE</span><span><b id="dv">2000</b> m</span></label><input id="dist" type="range" min="100" max="4000" step="50" value="2000"></div>
 <div class="row"><label><span>TURRET TRAVERSE</span><span><b id="tv">0</b>°</span></label><input id="trav" type="range" min="-180" max="180" value="0"></div>
 <div class="row"><label>QUALITY</label><div class="pills"><button class="pill" data-q="low">Low</button><button class="pill" data-q="medium">Medium</button><button class="pill" data-q="high">High</button></div></div>
 <div class="row"><label>OPTIONS</label><div class="pills"><button class="pill" data-t="ric">Ricochet roll</button><button class="pill" data-t="fx">Post FX</button><button class="pill" data-t="dof">Depth of field</button><button class="pill" data-t="inspect">Inspect</button><button class="pill" data-t="explode">Exploded view</button></div></div>
 <div class="row" id="exctl"><label><span>EXPLODE SPREAD</span></label><input id="spread" type="range" min="0" max="1.5" step=".01" value="1"></div>
 <div class="row"><label>CAMO</label><div class="pills" id="camos"></div></div>
 <div id="disc"></div>
</div></div>
<div id="knobs">
 <button class="knob" id="kCtl" title="Controls">⚙</button>
 <button class="knob" id="kReset" title="Reset camera">⟲</button>
 <button class="knob" id="kExplode" title="Exploded view" data-t="explode">⇹</button>
 <button class="knob" id="kReplay" title="Replay penetrator">▶</button>
 <button class="knob" id="kXray" title="X-ray">☰</button>
 <button class="knob" id="kClear" title="Clear decals">✕</button>
</div>
<div id="xr" class="glass open"><div class="hd">X-ray · RHAe along shot</div><div class="bd"><canvas id="xc" width="680" height="300"></canvas></div></div>
<div id="film" class="glass"><div class="slabel">TARGET VEHICLE</div><div class="strip" id="tankStrip"></div><div class="slabel" style="margin-top:6px">AMMUNITION</div><div class="strip" id="shellStrip"></div></div>
<div id="tip" class="glass"></div>
<script type="module" src="./main.js"></script>
</body></html>
